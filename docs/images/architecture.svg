<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Segoe UI, Manrope, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2fd3c4"/>
      <stop offset="1" stop-color="#3b6cf6"/>
    </linearGradient>
    <linearGradient id="aws" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff6ea"/>
      <stop offset="1" stop-color="#ffefd6"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#26344a"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c26a00"/>
    </marker>
    <style>
      .t { font-size: 19px; font-weight: 700; fill: #0d1b2a; }
      .s { font-size: 14.5px; fill: #4a5568; }
      .k { font-size: 12px; font-weight: 800; letter-spacing: 1.6px; fill: #3b6cf6; }
      .node { fill: #ffffff; stroke: #d7deeb; stroke-width: 1.5; }
      .hot { fill: #0d1b2a; }
      .hot-t { font-size: 19px; font-weight: 700; fill: #ffffff; }
      .hot-s { font-size: 14.5px; fill: #c9d4e6; }
      .line { stroke: #26344a; stroke-width: 2.2; fill: none; }
      .cloud { stroke: #c26a00; stroke-width: 2.2; fill: none; stroke-dasharray: 7 6; }
      .lbl { font-size: 13px; font-weight: 700; fill: #26344a; }
      .lblo { font-size: 13px; font-weight: 700; fill: #9a5200; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#eef1f7"/>
  <text x="40" y="58" font-size="32" font-weight="700" fill="#0d1b2a">Far Point · architecture</text>
  <text x="40" y="88" class="s">One loop every 2.5 s. The Decider makes the decision locally; Amazon Nova writes the words. Nothing that leaves the laptop is an image.</text>

  <!-- boundaries -->
  <rect x="30" y="110" width="1110" height="860" rx="34" fill="#f8fafe" stroke="#b9c5da" stroke-width="2"/>
  <text x="60" y="146" class="k">YOUR LAPTOP · WINDOWS 11 · RTX 4060 · EVERYTHING HERE STAYS LOCAL</text>
  <rect x="1170" y="110" width="400" height="860" rx="34" fill="url(#aws)" stroke="#e8b46b" stroke-width="2"/>
  <text x="1198" y="146" class="k" fill="#9a5200" style="fill:#9a5200">AWS · AMAZON BEDROCK · US-EAST-1</text>

  <!-- row 1: measure -->
  <rect x="60" y="175" width="190" height="110" rx="20" class="node"/>
  <text x="80" y="210" class="k">INPUT</text>
  <text x="80" y="238" class="t">Webcam</text>
  <text x="80" y="262" class="s">frames in memory,</text>
  <text x="80" y="280" class="s">never saved</text>

  <rect x="300" y="175" width="340" height="110" rx="20" class="node"/>
  <text x="322" y="210" class="k">1 · MEASURE</text>
  <text x="322" y="238" class="t">MediaPipe FaceLandmarker</text>
  <text x="322" y="262" class="s">iris-size distance, eye opening vs baseline,</text>
  <text x="322" y="280" class="s">blinks, head turn, room light</text>

  <rect x="690" y="175" width="420" height="110" rx="20" class="node"/>
  <text x="712" y="210" class="k">RENDER · CODE DOES THE ARITHMETIC</text>
  <text x="712" y="238" class="t">SignalTracker + facts renderer</text>
  <text x="712" y="262" class="s">"Viewing distance: 27 cm, under 30 cm for 8 s</text>
  <text x="712" y="280" class="s">(limit 5 s): too close, enlarging needed."</text>

  <rect x="690" y="315" width="420" height="62" rx="16" class="node"/>
  <text x="712" y="352" class="s"><tspan font-weight="700" fill="#0d1b2a">Foreground app (Win32)</tspan> · call? typing? fullscreen?</text>

  <!-- row 2: decide -->
  <rect x="60" y="420" width="560" height="150" rx="22" class="hot"/>
  <rect x="60" y="420" width="10" height="150" rx="5" fill="url(#g)"/>
  <text x="92" y="456" class="k" style="fill:#36dccd">2 · DECIDE · LOCAL GPU · 127.0.0.1:8099</text>
  <text x="92" y="488" class="hot-t">Strands Decider 2B (text mode)</text>
  <text x="92" y="514" class="hot-s">One request per tick: 8 "does rule N apply right now?"</text>
  <text x="92" y="534" class="hot-s">nouls + interrupt_ok over the same state</text>
  <text x="92" y="556" class="hot-s">p50 0.46-0.57 s · 0 tokens to the cloud</text>

  <rect x="670" y="420" width="440" height="150" rx="22" class="node"/>
  <text x="692" y="456" class="k">REFLEX GATE POLICY (patterns/reflex_gate)</text>
  <text x="692" y="488" class="t">Code applies the rulebook order</text>
  <text x="692" y="514" class="s">fires p ≥ 0.65 · clear p ≤ 0.35 · unsure between</text>
  <text x="692" y="534" class="s">unsure above the winner → ask Nova (text)</text>
  <text x="692" y="554" class="s">Nova unavailable → stay quiet</text>

  <!-- row 3: act -->
  <rect x="60" y="615" width="560" height="130" rx="22" class="node"/>
  <text x="82" y="650" class="k">3 · ACT · STRANDS AGENT, agent.tool.&lt;name&gt;()</text>
  <text x="82" y="680" class="t">InterruptGate · ConfirmGate (interventions)</text>
  <text x="82" y="706" class="s">no breaks during calls, typing or fullscreen video;</text>
  <text x="82" y="726" class="s">your approval before a rulebook or the email</text>

  <rect x="670" y="615" width="440" height="130" rx="22" class="node"/>
  <text x="692" y="650" class="k">REVERSIBLE ACTUATORS</text>
  <text x="692" y="680" class="t">Zoom · dark mode · brightness · break</text>
  <text x="692" y="706" class="s">originals journaled first, restored on exit</text>
  <text x="692" y="726" class="s">or after a crash</text>

  <!-- row 4: verify + dashboard -->
  <rect x="60" y="790" width="380" height="150" rx="22" class="node"/>
  <text x="82" y="825" class="k">4 · VERIFY</text>
  <text x="82" y="855" class="t">Did it help?</text>
  <text x="82" y="881" class="s">30 s later the camera numbers say worked,</text>
  <text x="82" y="901" class="s">no change or worse; breaks need 20 s</text>
  <text x="82" y="921" class="s">looking away. Failing tools get demoted.</text>

  <rect x="490" y="790" width="290" height="150" rx="22" class="node"/>
  <text x="512" y="825" class="k">BACKEND</text>
  <text x="512" y="855" class="t">FastAPI + WebSocket</text>
  <text x="512" y="881" class="s">127.0.0.1:8765 only,</text>
  <text x="512" y="901" class="s">localhost Origins only</text>

  <rect x="830" y="790" width="280" height="150" rx="22" class="node"/>
  <text x="852" y="825" class="k">DASHBOARD</text>
  <text x="852" y="855" class="t">React, in your browser</text>
  <text x="852" y="881" class="s">live eye + distance dial,</text>
  <text x="852" y="901" class="s">decisions, rulebook, report</text>

  <!-- AWS -->
  <rect x="1200" y="175" width="340" height="200" rx="22" fill="#ffffff" stroke="#e8b46b" stroke-width="1.5"/>
  <text x="1222" y="210" class="k" style="fill:#9a5200">MODEL</text>
  <text x="1222" y="242" class="t">us.amazon.nova-lite-v1:0</text>
  <text x="1222" y="268" class="s">through Strands BedrockModel,</text>
  <text x="1222" y="288" class="s">temperature 0, text-only prompts</text>
  <text x="1222" y="320" class="s">Measured: 2.6 s p50 per decision</text>
  <text x="1222" y="340" class="s">if it decided every tick alone,</text>
  <text x="1222" y="360" class="s">vs 0.57 s for the local Decider</text>
  <rect x="1200" y="420" width="340" height="150" rx="22" fill="#ffffff" stroke="#e8b46b" stroke-width="1.5"/>
  <text x="1222" y="456" class="k" style="fill:#9a5200">ESCALATION</text>
  <text x="1222" y="488" class="t">Amazon Nova Lite</text>
  <text x="1222" y="514" class="s">judges only the unsure rules,</text>
  <text x="1222" y="534" class="s">same text state, rate-limited</text>
  <text x="1222" y="554" class="s">(1 per 10 s, 300 per day)</text>

  <rect x="1200" y="615" width="340" height="215" rx="22" fill="#ffffff" stroke="#e8b46b" stroke-width="1.5"/>
  <text x="1222" y="650" class="k" style="fill:#9a5200">COACH · STRANDS AGENT</text>
  <text x="1222" y="682" class="t">Amazon Nova Lite</text>
  <text x="1222" y="708" class="s">your words → draft rulebook</text>
  <text x="1222" y="730" class="s">numbers → optometrist report</text>
  <text x="1222" y="752" class="s">unsure moments → rule proposals</text>
  <text x="1222" y="774" class="s">exam email draft (never sent)</text>
  <text x="1222" y="806" class="s" font-weight="700" fill="#9a5200">nothing applies until you approve</text>

  <rect x="1200" y="860" width="340" height="80" rx="18" fill="#0d1b2a"/>
  <text x="1222" y="895" class="hot-t" font-size="17">Face images uploaded: 0</text>
  <text x="1222" y="920" class="hot-s">Bedrock gets words and numbers only</text>

  <!-- arrows: measure chain -->
  <path class="line" d="M250 230 H296" marker-end="url(#a)"/>
  <path class="line" d="M640 230 H686" marker-end="url(#a)"/>
  <path class="line" d="M900 315 V289" marker-end="url(#a)"/>
  <path class="line" d="M780 285 C780 360 400 360 360 416" marker-end="url(#a)"/>
  <rect x="402" y="380" width="168" height="26" rx="13" fill="#ffffff" stroke="#d7deeb"/><text x="418" y="398" class="lbl">rendered text state</text>
  <path class="line" d="M620 495 H666" marker-end="url(#a)"/>
  <path class="line" d="M890 570 C890 595 360 590 340 611" marker-end="url(#a)"/>
  <rect x="530" y="583" width="146" height="26" rx="13" fill="#ffffff" stroke="#d7deeb"/><text x="546" y="601" class="lbl">at most one tool</text>
  <path class="line" d="M620 680 H666" marker-end="url(#a)"/>
  <path class="line" d="M890 745 C890 770 260 760 250 786" marker-end="url(#a)"/>
  <path class="line" d="M60 865 C10 865 10 230 56 230" marker-end="url(#a)"/>
  <text x="16" y="560" class="lbl" transform="rotate(-90 16 560)">next tick learns from the outcome</text>
  <path class="line" d="M440 865 H486" marker-end="url(#a)"/>
  <path class="line" d="M780 865 H826" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- arrows: cloud -->
  <path class="cloud" d="M1110 480 H1196" marker-end="url(#ao)"/>
  <path class="cloud" d="M1196 510 H1114" marker-end="url(#ao)"/>
  <text x="1118" y="470" class="lblo">text</text>
  <text x="1118" y="530" class="lblo">verdicts</text>
  <path class="cloud" d="M1110 830 H1152 V722 H1196" marker-end="url(#ao)"/>
  <text x="1163" y="905" class="lblo" transform="rotate(-90 1163 905)">numbers + your words</text>
</svg>
