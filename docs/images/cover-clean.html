<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Myrmidon cover (no text)</title>
<!-- Text-free cover for Builder Center (1200x675). Render: scripts/render_doc_images.py -->
<style>
  html, body { margin: 0; width: 1200px; height: 675px; overflow: hidden; }
  body {
    background:
      radial-gradient(700px 480px at 78% 8%, rgba(59,108,246,.40), transparent 62%),
      radial-gradient(620px 420px at 6% 104%, rgba(47,211,196,.32), transparent 62%),
      #070d18;
  }
  svg { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<svg width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <radialGradient id="ir" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8af3e6"/><stop offset=".5" stop-color="#2fd3c4"/><stop offset="1" stop-color="#1f4fd0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/><stop offset=".28" stop-color="#ffb547"/><stop offset=".45" stop-color="#2fd3c4"/><stop offset="1" stop-color="#3b6cf6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd3c4"/><stop offset="1" stop-color="#3b6cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="eyeclip"><path d="M-250,0 Q0,-178 250,0 Q0,178 -250,0 Z"/></clipPath>
  </defs>

  <!-- distance dial around the eye -->
  <g transform="translate(470 360)">
    <path d="M-330,60 A335,335 0 0 1 330,60" fill="none" stroke="#15233a" stroke-width="26" stroke-linecap="round"/>
    <path d="M-330,60 A335,335 0 0 1 330,60" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round" opacity=".9"/>
    <g stroke="#3a4f70" stroke-width="3">
      <line x1="-300" y1="-40" x2="-282" y2="-36"/><line x1="-210" y1="-200" x2="-198" y2="-186"/>
      <line x1="0" y1="-300" x2="0" y2="-282"/><line x1="210" y1="-200" x2="198" y2="-186"/>
      <line x1="300" y1="-40" x2="282" y2="-36"/>
    </g>
    <circle cx="-318" cy="-6" r="17" fill="#070d18" stroke="#2fd3c4" stroke-width="6"/>
    <circle cx="-318" cy="-6" r="7" fill="#2fd3c4"/>

    <!-- the eye -->
    <ellipse cx="0" cy="0" rx="210" ry="120" fill="#2fd3c4" opacity=".18" filter="url(#glow)"/>
    <path d="M-250,0 Q0,-178 250,0 Q0,178 -250,0 Z" fill="#eef3fb"/>
    <g clip-path="url(#eyeclip)">
      <circle r="92" fill="url(#ir)"/>
      <g stroke="#0d3a6b" stroke-width="2" opacity=".35">
        <line x1="0" y1="-92" x2="0" y2="-40"/><line x1="0" y1="40" x2="0" y2="92"/>
        <line x1="-92" y1="0" x2="-40" y2="0"/><line x1="40" y1="0" x2="92" y2="0"/>
        <line x1="-65" y1="-65" x2="-28" y2="-28"/><line x1="28" y1="28" x2="65" y2="65"/>
        <line x1="65" y1="-65" x2="28" y2="-28"/><line x1="-28" y1="28" x2="-65" y2="65"/>
      </g>
      <circle r="36" fill="#05101d"/>
      <circle cx="-26" cy="-28" r="13" fill="#fff" opacity=".9"/>
    </g>
    <path d="M-250,0 Q0,-178 250,0" fill="none" stroke="#0b1626" stroke-width="5"/>
    <!-- landmark points -->
    <g fill="#36dccd">
      <circle cx="-250" cy="0" r="5"/><circle cx="-200" cy="-62" r="5"/><circle cx="-130" cy="-80" r="5"/>
      <circle cx="-60" cy="-88" r="5"/><circle cx="10" cy="-89" r="5"/><circle cx="80" cy="-86" r="5"/>
      <circle cx="150" cy="-76" r="5"/><circle cx="210" cy="-52" r="5"/><circle cx="250" cy="0" r="5"/>
      <circle cx="-200" cy="62" r="5"/><circle cx="-130" cy="80" r="5"/><circle cx="-60" cy="88" r="5"/>
      <circle cx="10" cy="89" r="5"/><circle cx="80" cy="86" r="5"/><circle cx="150" cy="76" r="5"/>
      <circle cx="210" cy="52" r="5"/>
    </g>
    <!-- iris measurement -->
    <line x1="-92" y1="0" x2="92" y2="0" stroke="#ffb547" stroke-width="4"/>
    <circle cx="-92" cy="0" r="9" fill="#ffb547"/><circle cx="92" cy="0" r="9" fill="#ffb547"/>
  </g>

  <!-- the Decider's per-rule answers: one bar fires, the rest stay low -->
  <g transform="translate(880 196)">
    <rect x="-28" y="-34" width="304" height="324" rx="26" fill="#0e1a2b" stroke="#22324a" stroke-width="1.5"/>
    <circle cx="10" cy="0" r="14" fill="url(#bar)"/>
    <rect x="34" y="-8" width="150" height="16" rx="8" fill="#22324a"/>
    <g>
      <rect x="0" y="40" width="248" height="18" rx="9" fill="#15243a"/><rect x="0" y="40" width="236" height="18" rx="9" fill="url(#bar)"/>
      <rect x="0" y="76" width="248" height="18" rx="9" fill="#15243a"/><rect x="0" y="76" width="18" height="18" rx="9" fill="#7f93b3"/>
      <rect x="0" y="112" width="248" height="18" rx="9" fill="#15243a"/><rect x="0" y="112" width="16" height="18" rx="9" fill="#7f93b3"/>
      <rect x="0" y="148" width="248" height="18" rx="9" fill="#15243a"/><rect x="0" y="148" width="24" height="18" rx="9" fill="#7f93b3"/>
      <rect x="0" y="184" width="248" height="18" rx="9" fill="#15243a"/><rect x="0" y="184" width="30" height="18" rx="9" fill="#7f93b3"/>
      <rect x="0" y="220" width="248" height="18" rx="9" fill="#15243a"/><rect x="0" y="220" width="12" height="18" rx="9" fill="#7f93b3"/>
      <rect x="0" y="256" width="248" height="18" rx="9" fill="#15243a"/><rect x="0" y="256" width="46" height="18" rx="9" fill="#7f93b3"/>
    </g>
  </g>

  <!-- the loop: laptop → decision → screen, with a dashed hop to the cloud -->
  <g fill="none" stroke-width="3">
    <path d="M1090 150 C 1130 110, 1150 90, 1160 60" stroke="#ff9900" stroke-dasharray="8 8" opacity=".85"/>
  </g>
  <circle cx="1160" cy="54" r="10" fill="#ff9900" opacity=".9"/>

  <!-- logo mark -->
  <g transform="translate(40 36)">
    <rect width="64" height="64" rx="20" fill="#e9effa"/>
    <circle cx="32" cy="32" r="16" fill="none" stroke="url(#bar)" stroke-width="5"/>
    <circle cx="32" cy="32" r="6" fill="url(#bar)"/>
  </g>
</svg>
</body>
</html>
